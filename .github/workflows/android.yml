name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (engine + vision)
        run: ./gradlew :chess:test :vision:test --console=plain
      - name: Build APKs
        run: ./gradlew :app:assembleRelease :app:assembleDebug --console=plain
      - name: Render screenshots
        run: ./gradlew :app:recordRoborazziDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: chesslens-apks
          path: app/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/*.png
